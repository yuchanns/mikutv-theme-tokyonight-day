name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (defaults to v<plugin.json version>)
        required: false
        type: string
      dry_run:
        description: Validate and package without publishing a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, Package & Publish Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yuchanns/release-mikutv-plugin@v1
        with:
          tag: ${{ inputs.tag }}
          dry-run: ${{ inputs.dry_run || false }}
